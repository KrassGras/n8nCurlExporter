<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>n8n cURL Export</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>n8n cURL Export</h2>

  <div class="field">
    <label for="baseUrl">n8n Base URL <span class="required">*</span></label>
    <input type="url" id="baseUrl" placeholder="https://your-n8n.example.com">
    <small>The extension only activates on this origin.</small>
  </div>

  <div class="field">
    <label for="apiKey">API Key <span class="required">*</span></label>
    <input type="password" id="apiKey" placeholder="your-api-key">
    <small>Required for loading workflow data and references. Find it in n8n → Settings → API.</small>
  </div>

  <button id="save">Save</button>
  <p id="status"></p>
</body>
<script src="popup.js"></script>
</html>
